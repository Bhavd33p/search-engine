[package]
name = "search-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Full-text search engine: compressed positional inverted index, BM25/TF-IDF ranking, phrase and boolean queries, gRPC"
license = "MIT"
publish = false

[lib]
name = "search_engine"
path = "src/lib.rs"

[[bin]]
name = "search-engine"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive", "env"] }
ego-tree = "0.11"
lru = "0.19"
prost = "0.14"
redis = { version = "1.8", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "charset", "http2", "gzip"] }
rocksdb = { version = "0.25", default-features = false, features = ["bindgen-runtime"] }
rust-stemmers = "1.2"
scraper = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
texting_robots = "0.2"
thiserror = "2"
tokio = { version = "1.54", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tonic = "0.14"
tonic-prost = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-segmentation = "1.13"
url = "2.5"

[build-dependencies]
protoc-bin-vendored = "3.3"
tonic-prost-build = "0.14"

[dev-dependencies]
proptest = "1.12"
tempfile = "3.27"
tokio = { version = "1.54", features = ["test-util"] }
